<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="100%" height="100%" fill="#eef1f4"/><text x="60" y="90" font-family="Arial" font-size="42" font-weight="700">Waiting Applications</text><text x="60" y="160" font-family="Arial" font-size="26">Review member details and photo, then press Continue to activate.</text><rect x="60" y="220" width="1120" height="330" rx="24" fill="white" stroke="#d7dde3"/><text x="110" y="300" font-family="Arial" font-size="24" font-weight="700">1. Check the application details</text><text x="110" y="350" font-family="Arial" font-size="24">2. Confirm the member photo and membership type</text><text x="110" y="400" font-family="Arial" font-size="24">3. Press Continue when everything is correct</text><rect x="110" y="450" width="220" height="70" rx="14" fill="#ef7d00"/><text x="220" y="495" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="white">Continue</text><rect x="360" y="450" width="180" height="70" rx="14" fill="white" stroke="#bfc5ca"/><text x="450" y="495" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">Reject</text></svg>