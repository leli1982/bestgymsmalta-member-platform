name: Patch Member Email Identity UI

on:
  push:
    branches:
      - phase-2-operations-nfc-redesign
    paths:
      - .github/workflows/patch-member-email-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-operations-nfc-redesign
          fetch-depth: 0
      - name: Patch forgot password UI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/member-auth/MemberLoginPage.tsx')
          text = path.read_text()

          replacements = [
              (
                  '  const [forgotEmail, setForgotEmail] = useState("");\n',
                  '  const [forgotMemberNumber, setForgotMemberNumber] = useState("");\n  const [forgotEmail, setForgotEmail] = useState("");\n',
              ),
              (
                  '    if (!forgotEmail.trim()) {\n      setError("Enter your registered email address.");\n      return;\n    }',
                  '    if (!forgotMemberNumber.trim() || !forgotEmail.trim()) {\n      setError("Enter your membership number and registered email address.");\n      return;\n    }',
              ),
              (
                  '        body: JSON.stringify({\n          email: forgotEmail.trim(),\n        }),',
                  '        body: JSON.stringify({\n          memberNumber: forgotMemberNumber.trim(),\n          email: forgotEmail.trim(),\n        }),',
              ),
              (
                  '        data.message || "If that email is registered, we have sent a password reset link."',
                  '        data.message ||\n          "If those membership details are registered, we have sent a password reset link."',
              ),
              (
                  '              Enter your registered membership email address. If it exists in\n              the system, we will send you a secure reset link.',
                  '              Enter your permanent BGM membership number and registered email\n              address. If those details match, we will send you a secure reset link.',
              ),
              (
                  '            <label className="grid gap-2">\n              <span className="text-xs font-black uppercase tracking-[.18em] text-white/35">\n                Registered Email\n              </span>',
                  '''            <label className="grid gap-2">
              <span className="text-xs font-black uppercase tracking-[.18em] text-white/35">
                Membership Number
              </span>

              <div className="flex items-center gap-3 rounded-2xl border border-white/10 bg-black/30 px-4 py-3">
                <CreditCard className="text-white/30" size={18} strokeWidth={3} />
                <input
                  value={forgotMemberNumber}
                  onChange={(event) => setForgotMemberNumber(event.target.value)}
                  placeholder="BGM0000001"
                  autoCapitalize="characters"
                  className="w-full bg-transparent text-sm font-bold text-white outline-none placeholder:text-white/25"
                />
              </div>
            </label>

            <label className="grid gap-2">
              <span className="text-xs font-black uppercase tracking-[.18em] text-white/35">
                Registered Email
              </span>''',
              ),
              (
                  'placeholder="Example: BGM001"',
                  'placeholder="Example: BGM0000001"',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          required = [
              'forgotMemberNumber',
              'memberNumber: forgotMemberNumber.trim()',
              'Membership Number',
              'BGM0000001',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'Missing required marker after patch: {marker}')

          path.write_text(text)
          PY
      - name: Commit UI change
        run: |
          git config user.name "leli1982"
          git config user.email "133102486+leli1982@users.noreply.github.com"
          git add components/member-auth/MemberLoginPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: scope member password reset UI by membership number"
          git push origin HEAD:phase-2-operations-nfc-redesign
