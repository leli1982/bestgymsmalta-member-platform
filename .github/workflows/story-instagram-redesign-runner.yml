name: Apply Story Creator canvas-first redesign

on:
  push:
    branches:
      - ui/member-app-light-refresh-batch2
    paths:
      - .github/workflows/story-instagram-redesign-runner.yml

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ui/member-app-light-refresh-batch2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply canvas-first Story Creator UI
        run: python .github/scripts/story_instagram_redesign.py

      - name: Run Story UI contract
        run: node --experimental-strip-types --test tests/member-passport-story-light-ui-contract.test.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Next.js app
        run: npm run build

      - name: Commit redesign and remove temporary runner files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/story/StoryCreator.tsx
          git rm .github/workflows/story-instagram-redesign-runner.yml
          git rm .github/scripts/story_instagram_redesign.py
          git commit -m "ui: make Story Creator canvas-first"
          git push origin HEAD:ui/member-app-light-refresh-batch2
