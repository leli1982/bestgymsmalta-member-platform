name: Phase 2 CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - phase-2-operations-nfc-redesign
      - feature/tablet-enrollment-membership-settings
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser verification tools
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Run tests
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify member card and gym pages in Chromium
        run: node tests/browser/member-card-gyms.mjs

      - name: Verify staff dashboard workflow in Chromium
        run: node tests/browser/staff-dashboard.mjs

      - name: Save member UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-ui-screenshots
          path: test-artifacts/member-ui
          if-no-files-found: ignore

      - name: Save staff UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-ui-screenshots
          path: test-artifacts/staff-ui
          if-no-files-found: ignore
