name: Phase 2 CI

on:
  push:
    branches:
      - phase-2-operations-nfc-redesign
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run member session tests
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify Preview system auth dependencies
        run: |
          URL="https://bestgymsmalta-member-platfor-git-e7efcd-leliapap-2558s-projects.vercel.app/api/system/health"
          for attempt in $(seq 1 12); do
            body_file="$(mktemp)"
            status="$(curl -L -sS -o "$body_file" -w '%{http_code}' "$URL" || true)"
            if [ "$status" = "200" ] && node - "$body_file" <<'NODE'
          const fs = require('fs');
          try {
            const health = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            const healthy =
              health.hasSupabaseUrl === true &&
              health.hasSupabaseServiceRole === true &&
              health.hasSystemSessionSecret === true &&
              health.dbOk === true &&
              health.systemUserTableOk === true &&
              health.superAdminVisible === true &&
              health.databaseError === null;
            process.exit(healthy ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
            then
              echo "Preview system auth dependencies verified."
              rm -f "$body_file"
              exit 0
            fi
            echo "Preview health not ready yet (attempt $attempt/12, HTTP $status)."
            rm -f "$body_file"
            sleep 10
          done
          echo "Preview system auth dependency verification failed."
          exit 1
