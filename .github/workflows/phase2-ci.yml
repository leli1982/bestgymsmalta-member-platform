name: Phase 2 CI

on:
  push:
    branches:
      - phase-2-operations-nfc-redesign
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: phase2-package-lock
          path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run member session tests
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
