name: Phase 2 CI

on:
  push:
    branches:
      - phase-2-operations-nfc-redesign
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run member session tests
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify Preview system auth dependencies
        run: |
          URL="https://bestgymsmalta-member-platfor-git-e7efcd-leliapap-2558s-projects.vercel.app/api/system/health"
          last_body=""
          for attempt in 1 2 3 4 5 6; do
            body_file="$(mktemp)"
            status="$(curl -L -sS -o "$body_file" -w '%{http_code}' "$URL" || true)"
            last_body="$body_file"
            if [ "$status" = "200" ] && node - "$body_file" <<'NODE'
          const fs = require('fs');
          try {
            const h = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            const healthy =
              h.hasSupabaseUrl === true &&
              h.hasSupabaseServiceRole === true &&
              h.hasSystemSessionSecret === true &&
              h.dbOk === true &&
              h.systemUserTableOk === true &&
              h.superAdminVisible === true &&
              h.databaseError === null;
            process.exit(healthy ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
            then
              echo "Preview system auth dependencies verified."
              rm -f "$body_file"
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              rm -f "$body_file"
              last_body=""
              sleep 5
            fi
          done

          echo "Preview system auth dependency verification failed."
          if [ -n "$last_body" ] && [ -f "$last_body" ]; then
            node - "$last_body" <<'NODE'
          const fs = require('fs');
          const labels = [
            ['hasSupabaseUrl', 'supabaseUrlPresent'],
            ['hasSupabaseServiceRole', 'serviceRolePresent'],
            ['hasSystemSessionSecret', 'systemSessionSecretPresent'],
            ['dbOk', 'databaseReachable'],
            ['systemUserTableOk', 'systemUserTableReadable'],
            ['superAdminVisible', 'superAdminVisible'],
          ];
          try {
            const h = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            const failed = labels.filter(([key]) => h[key] !== true).map(([, label]) => label);
            if (h.databaseError !== null) failed.push('databaseReturnedError');
            console.error(`Failed checks: ${[...new Set(failed)].join(', ') || 'unknownResponse'}`);
          } catch {
            console.error('Failed checks: invalidHealthResponse');
          }
          NODE
            rm -f "$last_body"
          fi
          exit 1
