name: Phase 2 CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - phase-2-operations-nfc-redesign
      - feature/tablet-enrollment-membership-settings
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser verification tools
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Run tests
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify member card and gym pages in Chromium
        run: node tests/browser/member-card-gyms.mjs

      - name: Verify staff dashboard workflow in Chromium
        run: node tests/browser/staff-dashboard.mjs

      - name: Verify global card scanner while Staff edit forms in Chromium
        run: node tests/browser/staff-global-scanner.mjs

      - name: Verify Bar List and Super Admin catalogue in Chromium
        run: node tests/browser/bar-sales.mjs

      - name: Verify Super Admin operations dashboard in Chromium
        run: node tests/browser/operations-dashboard.mjs

      - name: Verify Super Admin gym and account management in Chromium
        run: node tests/browser/super-admin-management.mjs

      - name: Verify membership A4 print in Chromium
        run: node tests/browser/membership-print-a4.mjs

      - name: Verify nonblocking reception photo warning in Chromium
        run: node tests/browser/reception-photo-warning.mjs

      - name: Verify tablet enrollment workflow in Chromium
        run: node tests/browser/tablet-enrollment.mjs

      - name: Save member UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-ui-screenshots
          path: test-artifacts/member-ui
          if-no-files-found: ignore

      - name: Save staff UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-ui-screenshots
          path: |
            test-artifacts/staff-ui
            test-artifacts/staff-global-scanner
            test-artifacts/bar-sales
            test-artifacts/operations-dashboard
          if-no-files-found: ignore

      - name: Save membership print screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: membership-print-screenshots
          path: test-artifacts/print-a4
          if-no-files-found: error

      - name: Save reception photo-warning screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reception-photo-warning-screenshots
          path: test-artifacts/reception-photo
          if-no-files-found: error

      - name: Save tablet enrollment screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tablet-enrollment-screenshots
          path: test-artifacts/tablet-enrollment
          if-no-files-found: error
