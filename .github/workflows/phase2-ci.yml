name: Phase 2 CI

on:
  push:
    branches:
      - phase-2-operations-nfc-redesign
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run member session tests
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Probe Preview system auth runtime
        run: |
          URL="https://bestgymsmalta-member-platfor-git-e7efcd-leliapap-2558s-projects.vercel.app/api/system/auth"
          for attempt in 1 2 3 4 5 6; do
            echo "Runtime probe attempt $attempt"
            body_file="$(mktemp)"
            status="$(curl -sS -o "$body_file" -w '%{http_code}' "$URL" || true)"
            echo "HTTP $status"
            cat "$body_file"
            echo
            rm -f "$body_file"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          exit 1
