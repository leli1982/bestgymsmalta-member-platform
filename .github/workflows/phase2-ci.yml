name: Phase 2 CI

on:
  push:
    branches:
      - phase-2-operations-nfc-redesign
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run member session tests
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Redeploy trigger after Preview environment update.
      - name: Probe Preview system auth health
        run: |
          URL="https://bestgymsmalta-member-platfor-git-e7efcd-leliapap-2558s-projects.vercel.app/api/system/health"
          for attempt in 1 2 3 4 5 6; do
            body_file="$(mktemp)"
            result="$(curl -L -sS -o "$body_file" -w '%{http_code} %{url_effective}' "$URL" || true)"
            echo "Health probe attempt $attempt: $result"
            cat "$body_file"
            echo
            status="${result%% *}"
            if [ "$status" = "200" ]; then
              rm -f "$body_file"
              exit 0
            fi
            rm -f "$body_file"
            sleep 10
          done
          exit 1
