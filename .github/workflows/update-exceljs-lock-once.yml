name: Update ExcelJS lockfile once

on:
  push:
    branches:
      - phase-2-operations-nfc-redesign
    paths:
      - .github/workflows/update-exceljs-lock-once.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: phase-2-operations-nfc-redesign

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ExcelJS and update lockfile
        run: npm install exceljs@^4.4.0 --save

      - name: Commit generated package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package changes needed."
            exit 0
          fi
          git commit -m "chore: add ExcelJS dependency"
          git push origin HEAD:phase-2-operations-nfc-redesign
