name: Phase B Task 2 diagnostic

on:
  push:
    branches:
      - feature/phase-b-member-number-renumbering

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run exact unit suite and capture output
        shell: bash
        run: |
          set +e
          node --experimental-strip-types --test tests/*.test.mjs > phase-b-unit-tests.log 2>&1
          status=$?
          echo "$status" > phase-b-unit-tests.status
          tail -n 120 phase-b-unit-tests.log
          exit 0
      - name: Upload unit-test diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-unit-tests
          path: |
            phase-b-unit-tests.log
            phase-b-unit-tests.status
      - name: Enforce unit-test result
        shell: bash
        run: test "$(cat phase-b-unit-tests.status)" = "0"
