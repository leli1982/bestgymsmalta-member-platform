name: Bundle approved Wallet v8 artwork

on:
  push:
    branches:
      - release/member-card-v8-production
    paths:
      - .github/workflows/bundle-wallet-v8.yml

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/member-card-v8-production

      - name: Fetch exact approved TEST v8 artwork
        run: |
          set -euo pipefail
          mkdir -p public/wallet
          curl --fail --location --silent --show-error \
            'https://vlvyqdjhzdcxatilbdiv.supabase.co/functions/v1/bgm-wallet-hero-v8?v=8' \
            --output public/wallet/bgm-wallet-hero-v8.jpg
          test "$(wc -c < public/wallet/bgm-wallet-hero-v8.jpg)" -gt 50000
          test "$(xxd -p -l 2 public/wallet/bgm-wallet-hero-v8.jpg)" = "ffd8"
          test "$(tail -c 2 public/wallet/bgm-wallet-hero-v8.jpg | xxd -p)" = "ffd9"

      - name: Commit bundled artwork
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/wallet/bgm-wallet-hero-v8.jpg
          if git diff --cached --quiet; then
            echo 'Artwork already bundled.'
            exit 0
          fi
          git commit -m 'fix(wallet): bundle approved v8 artwork'
          git push origin HEAD:release/member-card-v8-production
