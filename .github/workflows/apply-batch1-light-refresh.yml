name: Apply Batch 1 light refresh

on:
  push:
    branches:
      - ui/member-app-light-refresh

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/member-app-light-refresh
          fetch-depth: 0

      - name: Apply presentation-only class changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label, count=-1):
              if old not in text:
                  raise SystemExit(f"Expected source pattern missing: {label}")
              return text.replace(old, new, count)

          # Mobility & Stretch: preserve all category/content logic and only restyle markup.
          path = Path("components/mobility/MobilityStretchPage.tsx")
          text = path.read_text()
          text = must_replace(text, '<AppShell>', '<AppShell theme="light">', 'mobility light shell', 1)
          text = must_replace(
              text,
              '<div className="min-h-screen bg-neutral-950 px-4 pb-28 pt-5 text-white">',
              '<div data-member-surface="mobility-light" className="min-h-screen bg-[#f6f6f6] px-4 pb-28 pt-5 text-zinc-950">',
              'mobility page surface',
              1,
          )
          text = text.replace('text-sm text-neutral-300 hover:text-white', 'text-sm font-semibold text-zinc-500 hover:text-zinc-950')
          text = text.replace('border border-orange-500/20 bg-neutral-900 shadow-2xl', 'border border-zinc-200 bg-zinc-900 shadow-lg')
          text = text.replace('className="text-3xl font-black tracking-tight"', 'className="text-3xl font-black tracking-tight text-white"')
          text = text.replace(
              'mt-5 rounded-[1.5rem] border border-yellow-500/20 bg-yellow-500/10 p-4 text-sm leading-6 text-yellow-100',
              'mt-5 rounded-[1.5rem] border border-amber-200 bg-amber-50 p-4 text-sm font-semibold leading-6 text-amber-900',
          )
          text = text.replace(
              'mt-5 rounded-[1.5rem] border border-white/10 bg-white/[0.04] p-4',
              'mt-5 rounded-[1.5rem] border border-zinc-200 bg-white p-4 shadow-sm',
          )
          text = text.replace('text-sm font-semibold text-neutral-200', 'text-sm font-bold text-zinc-700')
          text = text.replace(
              'w-full rounded-2xl border border-white/10 bg-neutral-950 px-4 py-3 text-white outline-none focus:border-orange-500',
              'w-full rounded-2xl border border-zinc-200 bg-zinc-50 px-4 py-3 font-semibold text-zinc-950 outline-none focus:border-[#ff5a0a] focus:ring-2 focus:ring-[#ff5a0a]/10',
          )
          text = text.replace('text-sm text-neutral-400', 'text-sm font-medium text-zinc-500')
          text = text.replace(
              'rounded-[1.5rem] border border-white/10 bg-white/[0.04] p-5',
              'rounded-[1.5rem] border border-zinc-200 bg-white p-5 shadow-sm',
          )
          text = text.replace('text-sm text-orange-300', 'text-sm font-bold text-[#ff5a0a]')
          text = text.replace(
              'flex shrink-0 items-center gap-2 rounded-full bg-orange-500/15 px-3 py-1 text-sm font-bold text-orange-200',
              'flex shrink-0 items-center gap-2 rounded-full border border-orange-200 bg-orange-50 px-3 py-1 text-sm font-black text-[#ff5a0a]',
          )
          text = text.replace('text-sm leading-6 text-neutral-300', 'text-sm font-medium leading-6 text-zinc-600')
          text = text.replace(
              'mt-4 flex gap-2 rounded-2xl border border-orange-500/15 bg-orange-500/10 p-3 text-xs leading-5 text-orange-100',
              'mt-4 flex gap-2 rounded-2xl border border-orange-200 bg-orange-50 p-3 text-xs font-semibold leading-5 text-orange-800',
          )
          path.write_text(text)

          # Progress Vault: preserve photo/API logic and keep the photo hero dark; restyle application surfaces below it.
          path = Path("components/progress/ProgressVault.tsx")
          text = path.read_text()
          text = text.replace(
              '<div className="space-y-6">',
              '<div data-member-surface="progress-light" className="space-y-5 text-zinc-950">',
          )
          text = text.replace('relative min-h-[360px] overflow-hidden rounded-[2.2rem]', 'relative min-h-[320px] overflow-hidden rounded-[2rem]')
          text = text.replace('relative min-h-[390px] overflow-hidden rounded-[2.2rem]', 'relative min-h-[340px] overflow-hidden rounded-[2rem]')
          text = text.replace('relative flex min-h-[310px] flex-col justify-between', 'relative flex min-h-[270px] flex-col justify-between')
          text = text.replace('relative flex min-h-[340px] flex-col justify-between', 'relative flex min-h-[298px] flex-col justify-between')
          marker = '      <section className="rounded-[2rem] border border-[#fcb415]/25 bg-[#fcb415]/10 p-5">'
          if marker not in text:
              raise SystemExit('Expected Progress Vault content boundary missing')
          prefix, suffix = text.split(marker, 1)
          marker_new = '      <section className="rounded-[1.8rem] border border-orange-200 bg-orange-50 p-5">'
          replacements = [
              ('border border-white/10 bg-white/[0.04]', 'border border-zinc-200 bg-white'),
              ('border border-white/10 bg-black/25', 'border border-zinc-200 bg-zinc-50'),
              ('border border-white/10 bg-black/30', 'border border-zinc-200 bg-zinc-50'),
              ('border border-[#fcb415]/25 bg-[#fcb415]/10', 'border border-orange-200 bg-orange-50'),
              ('bg-white/[0.04]', 'bg-white'),
              ('bg-black/25', 'bg-zinc-50'),
              ('bg-black/30', 'bg-zinc-50'),
              ('border-white/10', 'border-zinc-200'),
              ('text-white/35', 'text-zinc-400'),
              ('text-white/40', 'text-zinc-400'),
              ('text-white/45', 'text-zinc-500'),
              ('text-white/50', 'text-zinc-500'),
              ('text-white/55', 'text-zinc-600'),
              ('text-white/60', 'text-zinc-600'),
              ('text-white/65', 'text-zinc-600'),
              ('text-white/70', 'text-zinc-600'),
              ('text-white', 'text-zinc-950'),
              ('text-[#fcb415]', 'text-[#ff5a0a]'),
              ('bg-[#fcb415]', 'bg-[#ff5a0a]'),
          ]
          for old, new in replacements:
              suffix = suffix.replace(old, new)
          text = prefix + marker_new + suffix
          path.write_text(text)

          # Strength Tracker: no photo hero, so the complete tool can move to the light system.
          path = Path("components/progress/StrengthTracker.tsx")
          text = path.read_text()
          main = '<section className="space-y-5 rounded-[2.2rem] border border-white/10 bg-white/[0.04] p-5 shadow-2xl">'
          text = must_replace(
              text,
              main,
              '<section data-member-surface="strength-light" className="space-y-5 rounded-[2rem] border border-zinc-200 bg-white p-5 shadow-sm">',
              'strength main surface',
              1,
          )
          replacements = [
              ('bg-[#080808]', 'bg-white'),
              ('border-white/10', 'border-zinc-200'),
              ('bg-white/[0.04]', 'bg-white'),
              ('bg-white/[0.03]', 'bg-white'),
              ('bg-black/25', 'bg-zinc-50'),
              ('bg-black/35', 'bg-zinc-50'),
              ('bg-black/45', 'bg-zinc-50'),
              ('text-white/25', 'text-zinc-400'),
              ('text-white/35', 'text-zinc-400'),
              ('text-white/45', 'text-zinc-500'),
              ('text-white/50', 'text-zinc-500'),
              ('text-white/60', 'text-zinc-600'),
              ('text-white/70', 'text-zinc-600'),
              ('text-white', 'text-zinc-950'),
              ('#fcb415', '#ff5a0a'),
              ('rgba(255,255,255,0.18)', 'rgba(24,24,27,0.14)'),
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Commit transformed components and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-batch1-light-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/mobility/MobilityStretchPage.tsx components/progress/ProgressVault.tsx components/progress/StrengthTracker.tsx .github/workflows/apply-batch1-light-refresh.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ui: apply light surfaces to mobility and progress tools"
          git push origin HEAD:ui/member-app-light-refresh
